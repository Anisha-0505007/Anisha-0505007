name: Update Pac-Man Contribution

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate Pac-Man contribution graph
    uses: abozanona/pacman-contribution-graph@main
    with:
      github_user_name: Anisha-0505007
      games: "pacman"
      player_style: "opportunistic"
      hide_month_labels: "false"

  - name: Publish generated SVG
    uses: crazy-max/ghaction-github-pages@v3.1.0
    with:
      build_dir: dist
      target_branch: output
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
```
