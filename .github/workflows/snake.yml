name: Generate Contribution Snake

on:
schedule:
- cron: "0 0 * * *"
workflow_dispatch:

permissions:
contents: write

jobs:
generate:
runs-on: ubuntu-latest

```
steps:
  - name: Generate snake animation
    uses: Platane/snk@v3
    with:
      github_user_name: Anisha-0505007
      outputs: |
        dist/github-snake.svg?palette=github
        dist/github-snake-dark.svg?palette=github-dark&color_snake=#8B5CF6

  - name: Publish snake animation
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_branch: output
      publish_dir: ./dist
      force_orphan: true
```
